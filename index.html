<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#065f46">

  <title>IPM Scout</title>
  <link rel="stylesheet" href="css/style.css?v=204">
  <script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>

<body>

<div class="layout">
  <aside class="sidebar">
    <h2>IPM Scout</h2>
    <a class="nav-link active" onclick="showPage('scout')">Scout</a>
    <a class="nav-link" onclick="showPage('dashboard')">Dashboard</a>
    <a class="nav-link" onclick="showPage('heatmaps')">Heat Maps</a>
    <a class="nav-link" onclick="showPage('reports')">Reports</a>
  </aside>

  <main class="container">
    <h1>IPM Scout</h1>
    <div id="weekDisplay">Loading week...</div>
    <div id="currentScout"></div>

    <div id="scoutPage" class="card">
      <div id="sectionContainer"></div>
      <div id="bayContainer"></div>
      <div id="entryContainer"></div>
    </div>

    <div id="dashboardPage" class="card page hidden-page"></div>

    <div id="heatmapsPage" class="card page hidden-page">
      <h2>Heat Maps</h2>
      <p>Heat maps coming later.</p>
    </div>

    <div id="reportsPage" class="card page hidden-page">
      <h2>Reports</h2>
      <p>Reports coming later.</p>
    </div>

    <footer id="bottomBar" class="bottom-bar hidden">
      <button id="bottomSectionsBtn" onclick="goToSections()">⌂ Sections</button>
      <button id="bottomBaysBtn" onclick="goToBays()">◀ Bays</button>
    </footer>
  </main>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwdJdfkIzl3ndZZe7go7IB8EONnlMWcPaHKhfXGUoRco1ShtQ6fcmbyJYDH38Ee7ccy/exec";

const pests = ["Thrips", "Aphids", "Whiteflies", "Fungus Gnats"];

const bayMap = {
  "S1":["B1","B2","B3","B4","B5","B6"],
  "S2":["B2","B3","B4","B5","B6","B7","B8","B9","B10","B11","B12","B13","B14","B15","B16"],
  "S3":["B2","B3","B4","B5","B6","B7","B8","B9","B10","B11","B12","B13","B14","B15","B16"],
  "S4":["B1","B2","B3","B4","B5","B6","B7","B8","B9","B10","B11","B12","B13","B14","B15","B16"],
  "S5":["B4","B5","B6","B7","B8","B9","B10"],
  "S6":["B2","B3","B4","B5","B6","B7","B8","B9","B10"],
  "S7":["B2","B3","B4","B5","B6","B7","B8","B9","B10"],
  "S8":["B1","B2","B3","B4","B5","B6","B7","B8","B9"],
  "S9":["B1","B2","B3","B4","B5"],
  "S9A":["B6","B7","B8","B9","B10","B11","B12"],
  "S9B":["B6","B7","B8","B9","B10","B11","B12"],
  "S10A":["B1","B2","B3","B4","B5","B6","B7","B8","B9","B10"],
  "S10B":["B1","B2","B3","B4","B5","B6","B7","B8","B9","B10"]
};

const sectionOrder = ["S1","S2","S3","S4","S5","S6","S7","S8","S9","S9A","S9B","S10A","S10B"];

let selectedSection = "";
let selectedBay = "";
let weekStatus = {};
let currentWeek = "";
let currentScout = localStorage.getItem("currentScout") || "";

/*
 * Current-week entry cache.
 * Completed bays can open from this cache instead of requesting Google every time.
 */
let currentWeekEntries = {};
let entriesAreLoaded = false;
let entriesAreLoading = false;

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", initializeApp);
} else {
  initializeApp();
}

function initializeApp() {
  if (currentScout) {
    showScoutWithPencil();
    renderSections();
  } else {
    selectScout();
  }

  /*
   * getStatus is the reliable source for the week and bay colors.
   * getCurrentWeekEntries loads saved counts and notes for fast editing.
   */
  setTimeout(() => {
    loadStatus();
    loadCurrentWeekEntries(true);
  }, 50);

  /*
   * Keep both users synchronized without blocking the interface.
   */
  setInterval(() => {
    loadStatus();
    loadCurrentWeekEntries(true);
  }, 30000);
}

/* ---------- LOAD DATA ---------- */

function loadStatus() {
  const callbackName =
    "statusCallback_" +
    Date.now() +
    "_" +
    Math.random().toString(36).slice(2);

  const script = document.createElement("script");

  const timeout = setTimeout(() => {
    cleanup();
    console.warn("Status request timed out. The current screen remains available.");
  }, 8000);

  function cleanup() {
    clearTimeout(timeout);

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }

    try {
      delete window[callbackName];
    } catch (error) {
      window[callbackName] = undefined;
    }
  }

  window[callbackName] = function(data) {
    cleanup();

    if (!data || !data.success) return;

    weekStatus = data.records || {};
    currentWeek = data.week || "";

    document.getElementById("weekDisplay").innerHTML =
      currentWeek ? "Week " + currentWeek : "";

    if (selectedSection && !selectedBay) {
      showBays(selectedSection);
    }
  };

  script.onerror = function() {
    cleanup();
    console.warn("Could not retrieve shared bay status.");
  };

  script.src =
    API_URL +
    "?action=getStatus" +
    "&callback=" + callbackName +
    "&_=" + Date.now();

  document.body.appendChild(script);
}
function requestJsonp(action, params = {}, timeoutMs = 12000) {
  return new Promise((resolve, reject) => {
    const callbackName =
      action.replace(/[^a-zA-Z0-9]/g, "") +
      "Callback_" +
      Date.now() +
      "_" +
      Math.random().toString(36).slice(2);

    const script = document.createElement("script");

    const timeout = setTimeout(() => {
      cleanup();
      reject(new Error(action + " request timed out."));
    }, timeoutMs);

    function cleanup() {
      clearTimeout(timeout);

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

      try {
        delete window[callbackName];
      } catch (error) {
        window[callbackName] = undefined;
      }
    }

    window[callbackName] = function(data) {
      cleanup();
      resolve(data);
    };

    script.onerror = function() {
      cleanup();
      reject(new Error("Could not connect to Apps Script."));
    };

    const query = new URLSearchParams();
    query.append("action", action);
    query.append("callback", callbackName);
    query.append("_", Date.now());

    Object.keys(params).forEach(key => {
      query.append(key, params[key]);
    });

    script.src = API_URL + "?" + query.toString();
    document.body.appendChild(script);
  });
}

async function loadCurrentWeekEntries(force = false) {
  if (entriesAreLoading) {
    return false;
  }

  if (entriesAreLoaded && !force) {
    return true;
  }

  entriesAreLoading = true;

  try {
    const data = await requestJsonp(
      "getCurrentWeekEntries",
      {},
      12000
    );

    if (
      !data ||
      !data.success ||
      typeof data.entries !== "object" ||
      data.entries === null
    ) {
      console.warn(
        "getCurrentWeekEntries is not available in the deployed Apps Script yet.",
        data
      );

      return false;
    }

    currentWeekEntries = data.entries;
    entriesAreLoaded = true;

    /*
     * Build all bay colors from this same response.
     * This removes the need for a separate getStatus request.
     */
    weekStatus = {};

    Object.keys(currentWeekEntries).forEach(key => {
      weekStatus[key] =
        currentWeekEntries[key].status;
    });

    if (data.week) {
      currentWeek = data.week;

      document.getElementById("weekDisplay").innerHTML =
        "Week " + currentWeek;
    }

    if (selectedSection && !selectedBay) {
      renderBayScreen(selectedSection);
    }

    return true;

  } catch (error) {
    console.warn(
      "Could not load current-week entries:",
      error
    );

    return false;

  } finally {
    entriesAreLoading = false;
  }
}

async function loadDashboard() {
  const page = document.getElementById("dashboardPage");

  page.innerHTML = `
    <h2>Dashboard</h2>
    <div class="dashboard-card" style="text-align:center;font-weight:700;color:#64748b;">
      Loading dashboard...
    </div>
  `;

  try {
    const data = await requestJsonp("getDashboard", {}, 15000);
    renderDashboard(data);
  } catch (error) {
    console.error("Dashboard load failed:", error);

    page.innerHTML = `
      <h2>Dashboard</h2>
      <div class="dashboard-card" style="text-align:center;color:#dc2626;font-weight:700;">
        Could not load dashboard data.
        <br><br>
        <button class="download-btn" onclick="loadDashboard()">Try Again</button>
      </div>
    `;
  }
}

async function loadHeatMaps() {
  const page = document.getElementById("heatmapsPage");

  page.innerHTML = `
    <h2>Heat Maps</h2>
    <div class="dashboard-card" style="text-align:center;font-weight:700;color:#64748b;">
      Loading heat maps...
    </div>
  `;

  try {
    const data = await requestJsonp("getHeatMaps", {}, 15000);
    renderHeatMaps(data);
  } catch (error) {
    console.error("Heat map load failed:", error);

    page.innerHTML = `
      <h2>Heat Maps</h2>
      <div class="dashboard-card" style="text-align:center;color:#dc2626;font-weight:700;">
        Could not load heat map data.
        <br><br>
        <button class="download-btn" onclick="loadHeatMaps()">Try Again</button>
      </div>
    `;
  }
}

/* ---------- PAGE NAVIGATION ---------- */

function showPage(page) {
  document.getElementById("scoutPage").style.display = "none";
  document.getElementById("dashboardPage").style.display = "none";
  document.getElementById("heatmapsPage").style.display = "none";
  document.getElementById("reportsPage").style.display = "none";

  document.querySelectorAll(".nav-link").forEach(link => {
    link.classList.remove("active");
  });

  if (page === "scout") {
    document.getElementById("scoutPage").style.display = "block";
    document.querySelectorAll(".nav-link")[0].classList.add("active");
    renderSections();
  }

  if (page === "dashboard") {
    document.getElementById("dashboardPage").style.display = "block";
    document.querySelectorAll(".nav-link")[1].classList.add("active");
    updateBottomBar("sections");
    showScoutNameOnly();
    loadDashboard();
  }

  if (page === "heatmaps") {
    document.getElementById("heatmapsPage").style.display = "block";
    document.querySelectorAll(".nav-link")[2].classList.add("active");
    updateBottomBar("sections");
    showScoutNameOnly();
    loadHeatMaps();
  }

if (page === "reports") {
  document.getElementById("reportsPage").style.display = "block";
  document.querySelectorAll(".nav-link")[3].classList.add("active");
  updateBottomBar("sections");
  showScoutNameOnly();
  renderReportsPage();
}
}

/* ---------- SCOUT NAME ---------- */

function selectScout() {
  let html = `
    <h2>Scout Name</h2>

    <input
      id="scoutNameInput"
      class="scout-input"
      type="text"
      placeholder="Enter your name"
    >

    <button class="save-btn" onclick="saveScoutName()">
      Continue
    </button>
  `;

  document.getElementById("sectionContainer").innerHTML = html;
}

function saveScoutName() {
  const name = document.getElementById("scoutNameInput").value.trim();

  if (!name) {
    alert("Please enter your name.");
    return;
  }

  currentScout = name;
  localStorage.setItem("currentScout", name);

  showScoutWithPencil();
  renderSections();
}

function showScoutWithPencil() {
  document.getElementById("currentScout").innerHTML =
    `Scout: ${currentScout}&nbsp;<span class="edit-scout-btn" onclick="changeScout()">✎</span>`;
}

function showScoutNameOnly() {
  document.getElementById("currentScout").innerHTML =
    `Scout: ${currentScout}`;
}

function changeScout() {
  localStorage.removeItem("currentScout");
  currentScout = "";
  document.getElementById("currentScout").innerHTML = "";
  selectScout();
}

/* ---------- SCOUT PAGE ---------- */

function renderSections() {
  selectedSection = "";
  selectedBay = "";

  updateBottomBar("sections");
  showScoutWithPencil();

  document.getElementById("bayContainer").innerHTML = "";
  document.getElementById("entryContainer").innerHTML = "";

  let html = `<h2>Select Section</h2><div class="grid section-grid">`;

  sectionOrder.forEach(section => {
    html += `
      <button class="btn" onclick="showBays('${section}')">
        ${section}
      </button>
    `;
  });

  html += `</div>`;
  document.getElementById("sectionContainer").innerHTML = html;
}

function showBays(section) {
  selectedSection = section;
  selectedBay = "";

  /*
   * Open immediately using the data already loaded in memory.
   */
  renderBayScreen(section);
}

function renderBayScreen(section) {
  if (!bayMap[section]) {
    console.error("Section not found:", section);
    return;
  }

  const progress = getSectionPercent(section);

  updateBottomBar("bays");
  showScoutNameOnly();

  document.getElementById("sectionContainer").innerHTML = "";
  document.getElementById("entryContainer").innerHTML = "";

  let html = `
    <h2>${section} - Select Bay</h2>

    <div class="section-percent">
      Progress: ${progress}%
    </div>

    <div class="grid bay-grid">
  `;

  bayMap[section].forEach(bay => {
    const statusClass =
      getBayStatus(section, bay);

    html += `
      <button
        class="btn ${statusClass}"
        onclick="handleBayClick('${bay}')"
      >
        ${bay}
      </button>
    `;
  });

  html += `</div>`;

  document.getElementById("bayContainer").innerHTML = html;
}

function getSectionPercent(section) {
  const total = bayMap[section].length;
  let completed = 0;

  bayMap[section].forEach(bay => {
    const key = section + "|" + bay;

    if (weekStatus[key] === "Scouted" || weekStatus[key] === "Empty") {
      completed++;
    }
  });

  return Math.round((completed / total) * 100);
}

function getBayStatus(section, bay) {
  const key = section + "|" + bay;
  const status = weekStatus[key];

  if (status === "Scouted") return "scouted";
  if (status === "Empty") return "empty";

  return "not-scouted";
}

function getEntryData(section, bay) {
  return new Promise((resolve, reject) => {
    const callbackName =
      "entryCallback_" +
      Date.now() +
      "_" +
      Math.random().toString(36).slice(2);

    const script = document.createElement("script");

    const timeout = setTimeout(() => {
      cleanup();
      reject(new Error("Saved entry request timed out."));
    }, 8000);

    function cleanup() {
      clearTimeout(timeout);

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

      try {
        delete window[callbackName];
      } catch (error) {
        window[callbackName] = undefined;
      }
    }

    window[callbackName] = function(data) {
      cleanup();
      resolve(data);
    };

    script.onerror = function() {
      cleanup();
      reject(new Error("Could not connect to Apps Script."));
    };

    script.src =
      API_URL +
      "?action=getEntry" +
      "&section=" + encodeURIComponent(section) +
      "&bay=" + encodeURIComponent(bay) +
      "&callback=" + callbackName +
      "&_=" + Date.now();

    document.body.appendChild(script);
  });
}

async function handleBayClick(bay) {
  const sectionAtOpen = selectedSection;
  const key = sectionAtOpen + "|" + bay;
  const status = weekStatus[key];

  if (status !== "Scouted" && status !== "Empty") {
    showEntry(bay);
    return;
  }

  const answer = confirm(
    "This bay was already entered this week.\n\nDo you want to modify it?"
  );

  if (!answer) return;

  /*
   * Open immediately from the current-week cache when available.
   */
  const cachedEntry = currentWeekEntries[key];

  if (cachedEntry) {
    showEntry(bay, cachedEntry);
    return;
  }

  selectedBay = bay;
  updateBottomBar("entry");
  showScoutNameOnly();

  document.getElementById("bayContainer").innerHTML = `
    <div class="dashboard-card" style="text-align:center;padding:28px;color:#64748b;font-weight:700;">
      Loading saved entry...
    </div>
  `;

  try {
    /*
     * First try to finish loading the whole current-week cache.
     */
    await loadCurrentWeekEntries();

    if (
      selectedSection !== sectionAtOpen ||
      selectedBay !== bay
    ) {
      return;
    }

    if (currentWeekEntries[key]) {
      showEntry(bay, currentWeekEntries[key]);
      return;
    }

    /*
     * Fallback for an entry that was not yet in the shared cache.
     */
    const entryData = await getEntryData(sectionAtOpen, bay);

    if (
      selectedSection !== sectionAtOpen ||
      selectedBay !== bay
    ) {
      return;
    }

    currentWeekEntries[key] = entryData;
    showEntry(bay, entryData);

  } catch (error) {
    console.error("Could not load saved entry:", error);

    document.getElementById("bayContainer").innerHTML = `
      <div class="dashboard-card" style="text-align:center;padding:24px;color:#dc2626;font-weight:700;">
        Could not load the saved entry.<br><br>
        <button class="btn" onclick="showBays('${sectionAtOpen}')">
          Return to Bays
        </button>
      </div>
    `;
  }
}

function showEntry(bay, entryData = null) {
  selectedBay = bay;

  updateBottomBar("entry");
  showScoutNameOnly();

  document.getElementById("bayContainer").innerHTML = "";

  let html = `<h2>${selectedSection} - ${selectedBay}</h2>`;

  pests.forEach(pest => {
    const savedValue =
      entryData && entryData.counts[pest] !== ""
        ? entryData.counts[pest]
        : "";

    html += `
      <div class="entry-row">
        <label>${pest}</label>
        <input type="number" min="0" placeholder="0" value="${savedValue}" data-pest="${pest}">
      </div>
    `;
  });

  const savedNotes = entryData ? entryData.notes || "" : "";
  const lastUpdated = entryData && entryData.lastUpdated
    ? new Date(entryData.lastUpdated).toLocaleString()
    : "";
  const lastScout = entryData && entryData.lastScout
    ? entryData.lastScout
    : "";

  html += `
    <label><strong>Notes</strong></label>
    <textarea id="notes" placeholder="Crop, location, treatment, beneficials...">${savedNotes}</textarea>

    <button class="save-btn" onclick="saveCounts()">Save Counts</button>
    <button class="empty-btn" onclick="saveEmptyBay()">No Plants</button>

    ${lastUpdated ? `<div class="last-updated">Last updated: ${lastScout ? lastScout + " - " : ""}${lastUpdated}</div>` : ""}

    <div id="message" class="message"></div>
  `;

  document.getElementById("entryContainer").innerHTML = html;
}

function sendToSheet(params) {
  const formData = new URLSearchParams();

  Object.keys(params).forEach(key => {
    formData.append(key, params[key]);
  });

  fetch(API_URL, {
    method: "POST",
    mode: "no-cors",
    headers: {
      "Content-Type": "application/x-www-form-urlencoded"
    },
    body: formData.toString()
  }).catch(error => {
    console.error("Background submission failed:", error);
  });
}

function saveCounts() {
  const values = {};

  document.querySelectorAll("#entryContainer input").forEach(input => {
    values[input.dataset.pest] = input.value;
  });

  const sectionAtSave = selectedSection;
  const bayAtSave = selectedBay;
  const key = sectionAtSave + "|" + bayAtSave;
  const message = document.getElementById("message");
  const notes = document.getElementById("notes");

  if (!message) return;

  message.innerHTML = "Sending...";
  message.className = "message";

  try {
    sendToSheet({
      scout: currentScout,
      section: sectionAtSave,
      bay: bayAtSave,
      status: "Scouted",
      thrips: values["Thrips"] || 0,
      aphids: values["Aphids"] || 0,
      whiteflies: values["Whiteflies"] || 0,
      fungusGnats: values["Fungus Gnats"] || 0,
      notes: notes ? notes.value : ""
    });

    weekStatus[key] = "Scouted";

    currentWeekEntries[key] = {
      section: sectionAtSave,
      bay: bayAtSave,
      status: "Scouted",
      counts: {
        "Thrips": Number(values["Thrips"] || 0),
        "Aphids": Number(values["Aphids"] || 0),
        "Whiteflies": Number(values["Whiteflies"] || 0),
        "Fungus Gnats": Number(values["Fungus Gnats"] || 0)
      },
      notes: notes ? notes.value : "",
      lastUpdated: new Date().toISOString(),
      lastScout: currentScout
    };

    message.innerHTML = "✓ Submitted";
    message.className = "message success-message";

    setTimeout(() => {
      selectedBay = "";
      showBays(sectionAtSave);
    }, 250);

    setTimeout(() => {
      loadStatus();
      loadCurrentWeekEntries(true);
    }, 1800);
  } catch (error) {
    console.error("Submission failed:", error);
    message.innerHTML = "Submission failed. Please check your connection.";
    message.className = "message error-message";
  }
}

function saveEmptyBay() {
  const sectionAtSave = selectedSection;
  const bayAtSave = selectedBay;
  const key = sectionAtSave + "|" + bayAtSave;
  const message = document.getElementById("message");
  const notes = document.getElementById("notes");

  if (!message) return;

  message.innerHTML = "Sending...";
  message.className = "message";

  try {
    sendToSheet({
      scout: currentScout,
      section: sectionAtSave,
      bay: bayAtSave,
      status: "Empty",
      notes: notes && notes.value ? notes.value : "No plants"
    });

    weekStatus[key] = "Empty";

    currentWeekEntries[key] = {
      section: sectionAtSave,
      bay: bayAtSave,
      status: "Empty",
      counts: {
        "Thrips": "",
        "Aphids": "",
        "Whiteflies": "",
        "Fungus Gnats": ""
      },
      notes: notes && notes.value ? notes.value : "No plants",
      lastUpdated: new Date().toISOString(),
      lastScout: currentScout
    };

    message.innerHTML = "✓ Empty bay submitted";
    message.className = "message success-message";

    setTimeout(() => {
      selectedBay = "";
      showBays(sectionAtSave);
    }, 250);

    setTimeout(() => {
      loadStatus();
      loadCurrentWeekEntries(true);
    }, 1800);
  } catch (error) {
    console.error("Empty bay submission failed:", error);
    message.innerHTML = "Submission failed. Please check your connection.";
    message.className = "message error-message";
  }
}

/* ---------- DASHBOARD ---------- */

function renderDashboard(data) {
  if (!data || !data.success) {
    document.getElementById("dashboardPage").innerHTML =
      "<h2>Dashboard</h2><p>Could not load dashboard data.</p>";
    return;
  }

  const sectionData = data.sectionData;
  const hotspots = data.hotspots;

  let html = `
    <h2>Dashboard</h2>

    <div class="dashboard-card">
      <div class="dashboard-title">Week ${data.week}</div>
      <div class="dashboard-percent">${data.progress}% Complete</div>
      <div class="progress-bar">
        <div class="progress-fill" style="width:${data.progress}%"></div>
      </div>
    </div>

    <div class="dashboard-card">
      <h3>Section Completion</h3>
  `;

  Object.keys(sectionData).forEach(section => {
    html += `
      <div class="section-row">
        <span>${section}</span>
        <div class="small-progress">
          <div class="small-fill" style="width:${sectionData[section].progress}%"></div>
        </div>
        <strong>${sectionData[section].progress}%</strong>
      </div>
    `;
  });

  html += `
    </div>

    <div class="dashboard-card">
      <h3>Hotspots</h3>
      <div class="hotspot-grid">
  `;

  Object.keys(hotspots).forEach(pest => {
    const pestClass = {
      "Thrips": "hotspot-thrips",
      "Aphids": "hotspot-aphids",
      "Whiteflies": "hotspot-whiteflies",
      "Fungus Gnats": "hotspot-fungus"
    }[pest];

/* ---------- HEAT MAPS ---------- */

function getThripsColor(v) {
  if (v >= 120) return "#7F0000";
  if (v >= 100) return "#A30000";
  if (v >= 80)  return "#C40000";
  if (v >= 65)  return "#D94715";
  if (v >= 50)  return "#E96E21";
  if (v >= 35)  return "#F08E2E";
  if (v >= 25)  return "#EBC46A";
  if (v >= 15)  return "#F6E8B1";
  return "#FFFFFF";
}

function getFungusColor(v) {
  if (v >= 1500) return "#1B5E20";
  if (v >= 1200) return "#2E7D32";
  if (v >= 900)  return "#3E8E41";
  if (v >= 700)  return "#5E9E45";
  if (v >= 500)  return "#7CB342";
  if (v >= 300)  return "#A5C85A";
  if (v >= 100)  return "#C5D97A";
  if (v > 0)     return "#E6EFC1";
  return "#F8F8F8";
}

function getAphidColor(v) {

  if (v >= 80) return "#8A5A00";   // dark amber
  if (v >= 60) return "#A66A00";
  if (v >= 40) return "#C88719";
  if (v >= 25) return "#DDAA3A";
  if (v >= 15) return "#E8C86A";
  if (v >= 10) return "#F1DE9A";
  if (v >= 5)  return "#F7EBC3";
  return "#FFF8E6";

}
function getWhiteflyColor(v) {

  if (v >= 50) return "#7A3E00";
  if (v >= 35) return "#A55200";
  if (v >= 25) return "#C96B00";
  if (v >= 15) return "#E58A00";
  if (v >= 10) return "#F2B441";
  if (v >= 5)  return "#F8D78A";

  return "#FFF5DD";
}

 
function getTextColor(backgroundColor) {
const darkColors = [
  "#8A5A00",
  "#A66A00",
  "#C88719",
  "#7F0000",
  "#A30000",
  "#C40000",
  "#1B5E20",
  "#2E7D32",
  "#3E8E41"
];

  return darkColors.includes(backgroundColor) ? "white" : "#111827";
}

function buildHotspotsFromBayCounts(bayCounts, pest, threshold) {
  const hotspots = [];

  Object.keys(bayCounts || {}).forEach(section => {
    Object.keys(bayCounts[section] || {}).forEach(bay => {
      const bayData = bayCounts[section][bay] || {};
      const value = Number(bayData[pest] || 0);

      if (value >= threshold) {
        hotspots.push({
          label: section + bay,
          count: value
        });
      }
    });
  });

  hotspots.sort((a, b) => b.count - a.count);
  return hotspots;
}

function chunkArray(array, size) {
  const chunks = [];

  for (let i = 0; i < array.length; i += size) {
    chunks.push(array.slice(i, i + size));
  }

  return chunks;
}

function renderSummaryHotspots(title, threshold, hotspotList) {
  const count = hotspotList ? hotspotList.length : 0;
  const topItems = hotspotList ? hotspotList.slice(0, 5) : [];

  let html = `
    <div class="dashboard-card">
      <h3>${title}</h3>
      <div class="dashboard-percent">${count} Bays</div>
      <div class="heat-subtitle">Threshold ≥ ${threshold}</div>
  `;

  if (count === 0) {
    html += `<p>No hotspots above threshold this week.</p>`;
  } else {
    topItems.forEach(item => {
      html += `
        <div class="section-row">
          <span>${item.label}</span>
          <div class="small-progress">
            <div class="small-fill" style="width:100%"></div>
          </div>
          <strong>${item.count}</strong>
        </div>
      `;
    });
  }

  html += `</div>`;
  return html;
}
function renderExportStrip(title, subtitle, items, pest, perRow = 10) {

  if (!items || items.length === 0) {
    return "";
  }

  let html = `
    <div class="export-strip-section">
      <div class="export-strip-title">
        <span>${title}</span>
        <em>${subtitle}</em>
      </div>
  `;

  const rows = chunkArray(items, perRow);

  rows.forEach(row => {
    html += `<div class="export-strip-row">`;

    row.forEach(item => {
      let color = "#FFFFFF";

      if (pest === "Thrips") {
        color = getThripsColor(item.count);
      }

      if (pest === "Aphids") {
        color = getAphidColor(item.count);
      }

      if (pest === "Whiteflies") {
        color = getWhiteflyColor(item.count);
      }

      const textColor = getTextColor(color);

      html += `
        <div
          class="export-strip-cell"
          style="background:${color}; color:${textColor};"
        >
          <strong>${item.count}</strong>
          <span>${item.label}</span>
        </div>
      `;
    });

    html += `</div>`;
  });

  html += `</div>`;
  return html;
}

function getFungusInsight(fungusData) {
  const items = [];

  Object.keys(fungusData || {}).forEach(section => {
    const value = Number(fungusData[section]["Fungus Gnats"] || 0);
    if (value > 0) {
      items.push({ section, value });
    }
  });

  items.sort((a, b) => b.value - a.value);

  if (items.length === 0) {
    return "No significant pressure this week.";
  }

  return `Highest pressure in ${items.slice(0, 3).map(x => x.section).join(", ")}.`;
}
async function waitForExportImages(element) {
  const images = Array.from(element.querySelectorAll("img"));

  await Promise.all(
    images.map(image => {
      if (image.complete) {
        return Promise.resolve();
      }

      return new Promise(resolve => {
        image.addEventListener("load", resolve, { once: true });
        image.addEventListener("error", resolve, { once: true });
      });
    })
  );
}

async function downloadElementAsPng(elementId, fileName, backgroundColor = "#ffffff") {
  const element = document.getElementById(elementId);

  if (!element) {
    alert("The export figure is not ready yet.");
    return;
  }

  if (typeof html2canvas !== "function") {
    alert("The download library is still loading. Please try again in a moment.");
    return;
  }

  const originalStyles = {
    position: element.style.position,
    left: element.style.left,
    top: element.style.top,
    zIndex: element.style.zIndex,
    display: element.style.display,
    visibility: element.style.visibility,
    overflow: element.style.overflow
  };

  try {
    /*
     * Move hidden export content into the renderable viewport
     * without displaying it above the app.
     */
    element.style.position = "fixed";
    element.style.left = "0";
    element.style.top = "0";
    element.style.zIndex = "-9999";
    element.style.display = "block";
    element.style.visibility = "visible";
    element.style.overflow = "visible";

    await waitForExportImages(element);

    if (document.fonts && document.fonts.ready) {
      await document.fonts.ready;
    }

    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));

    const canvas = await html2canvas(element, {
      backgroundColor: backgroundColor,
      scale: 4,
      useCORS: true,
      allowTaint: false,
      logging: false,
      width: element.scrollWidth,
      height: element.scrollHeight,
      windowWidth: Math.max(document.documentElement.clientWidth, element.scrollWidth),
      windowHeight: Math.max(document.documentElement.clientHeight, element.scrollHeight)
    });

    const link = document.createElement("a");
    link.download = fileName;
    link.href = canvas.toDataURL("image/png");
    link.click();

  } catch (error) {
    console.error("PNG download failed:", error);
    alert("The figure could not be downloaded. Please try again.");
  } finally {
    element.style.position = originalStyles.position;
    element.style.left = originalStyles.left;
    element.style.top = originalStyles.top;
    element.style.zIndex = originalStyles.zIndex;
    element.style.display = originalStyles.display;
    element.style.visibility = originalStyles.visibility;
    element.style.overflow = originalStyles.overflow;
  }
}
